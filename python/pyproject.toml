[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keytd-manat"
version = "0.1.0"
description = "One API for Azerbaijani online payment providers: Kapital Bank, Azericard, Payriff, Epoint, GoldenPay and Yığım."
readme = "README.md"
license = "MIT"
authors = [{name = "KeyTD", email = "info@keytd.com"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["azerbaijan", "payments", "azn", "manat", "payment-gateway", "kapital-bank", "azericard", "payriff", "epoint", "goldenpay", "yigim"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/KeyTechAndDesign/manat"
Issues = "https://github.com/KeyTechAndDesign/manat/issues"

[tool.setuptools.packages.find]
where = ["src"]
